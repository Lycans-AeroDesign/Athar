# Dev stack: hot-reloading backend (runserver) + frontend (next dev), Postgres.
# Copy .env.example to .env at the repo root first, then:
#   docker compose up

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lycans_kms}
      POSTGRES_USER: ${POSTGRES_USER:-lycans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lycans}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lycans} -d ${POSTGRES_DB:-lycans_kms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-lycans}:${POSTGRES_PASSWORD:-lycans}@db:5432/${POSTGRES_DB:-lycans_kms}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-False}
      JWT_REFRESH_COOKIE_SAMESITE: ${JWT_REFRESH_COOKIE_SAMESITE:-Lax}
      JWT_REFRESH_COOKIE_DOMAIN: ${JWT_REFRESH_COOKIE_DOMAIN:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-True}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Reverse proxy in front of the backend only (see nginx/nginx.conf's own
  # header comment) - frontend keeps its own port/origin (FRONTEND_PORT), so
  # this doesn't change NEXT_PUBLIC_API_URL/CORS_ALLOWED_ORIGINS. Not on the
  # app's own request path yet; it's here for prod-parity testing of rate
  # limiting/security headers/health checks before docker-compose.prod.yml's
  # copy of this same config is ever pointed at a real domain.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
