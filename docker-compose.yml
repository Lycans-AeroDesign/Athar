# Dev stack: hot-reloading backend (runserver) + frontend (next dev), Postgres.
# Copy .env.example to .env at the repo root first, then:
#   docker compose up

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lycans_kms}
      POSTGRES_USER: ${POSTGRES_USER:-lycans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lycans}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lycans} -d ${POSTGRES_DB:-lycans_kms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment: &backend_env
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-lycans}:${POSTGRES_PASSWORD:-lycans}@db:5432/${POSTGRES_DB:-lycans_kms}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-False}
      JWT_REFRESH_COOKIE_SAMESITE: ${JWT_REFRESH_COOKIE_SAMESITE:-Lax}
      JWT_REFRESH_COOKIE_DOMAIN: ${JWT_REFRESH_COOKIE_DOMAIN:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-True}
      ENABLE_ORGANIZATION_REGISTRATION: ${ENABLE_ORGANIZATION_REGISTRATION:-True}
      # File storage - empty means local disk (see backend/.env.example);
      # set AWS_STORAGE_BUCKET_NAME (root .env) to switch to S3-compatible
      # object storage instead.
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background job runner for backups.tasks.generate_org_backup (see Settings
  # > Backups) - same image/env as backend, just a different container
  # command. Runs the same entrypoint.sh (migrate/seed_rbac on start too,
  # which is idempotent) before execing the worker instead of runserver.
  celery-worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment: *backend_env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fires CELERY_BEAT_SCHEDULE (config/settings.py) - currently just
  # files.tasks.delete_unconfirmed_files, hourly. Same image/env as
  # celery-worker, which is the process that actually executes what this
  # schedules; a separate container (not `celery -A config worker -B`) so a
  # worker restart never drops/duplicates the schedule's own timer state.
  celery-beat:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    # See the matching comment in docker-compose.prod.yml - the entrypoint
    # drops to appuser before running this, and /app (celery beat's default
    # relative schedule-file location) isn't writable by appuser here either.
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
    environment: *backend_env
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Reverse proxy in front of the backend only (see nginx/nginx.conf's own
  # header comment) - frontend keeps its own port/origin (FRONTEND_PORT), so
  # this doesn't change NEXT_PUBLIC_API_URL/CORS_ALLOWED_ORIGINS. Not on the
  # app's own request path yet; it's here for prod-parity testing of rate
  # limiting/security headers/health checks before docker-compose.prod.yml's
  # copy of this same config is ever pointed at a real domain.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # Mounted as default.conf.template (not dev.conf.template) so its
      # rendered output overwrites the image's own stock conf.d/default.conf
      # (the "Welcome to nginx" page) - otherwise both it and ours would
      # claim the same server_name/port and nginx would pick one arbitrarily.
      - ./nginx/templates/dev.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/templates/locations.inc.template:/etc/nginx/templates/locations.inc.template:ro
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
