# Dependency update PRs, kept to at most one open PR per ecosystem:
#   * Routine (version) updates run monthly and group every minor/patch bump
#     of an ecosystem into a single PR.
#   * Major versions are skipped for routine updates - they need real testing,
#     so upgrade those deliberately. Security updates still cover them.
#   * npm/uv use lockfile-only: Dependabot refreshes the lockfiles within the
#     ranges already in package.json/pyproject.toml instead of opening a PR
#     per rewritten range.
#   * Security updates (raised when an advisory is published, independent of
#     the schedule) are grouped too, so a batch of advisories is one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      frontend:
        applies-to: version-updates
        patterns: ["*"]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      backend:
        applies-to: version-updates
        patterns: ["*"]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base images (python:slim, node:alpine, uv) in the two Dockerfiles.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
