version: 2

# Weekly version-update PRs. Security advisories are raised separately by GitHub
# (Settings > Code security > Dependabot alerts / security updates).
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Type definitions must track the Node version the images run (24), not the newest major.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 breaks eslint-plugin-react (via eslint-config-next); revisit when it supports it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
