# Builds and pushes the backend/frontend prod images to GHCR.
#
# Runs automatically when a semver tag (v1.2.3) is pushed - that's the normal
# release path: `git tag v1.2.3 && git push origin v1.2.3`. Can also be run
# manually from the Actions tab for a one-off/test build.
#
# NEXT_PUBLIC_API_URL is read from the "NEXT_PUBLIC_API_URL" repository
# variable (Settings > Secrets and variables > Actions > Variables) by
# default - it's not sensitive (it ends up in the public frontend JS bundle
# either way), so it doesn't belong in Secrets. A manual run can override it
# via the workflow_dispatch input instead, e.g. to test against a different
# domain without touching the repo variable.

name: Publish Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (in addition to latest) - manual runs only"
        required: false
        default: "manual"
      next_public_api_url:
        description: "Override the NEXT_PUBLIC_API_URL repo variable for this build"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image namespace
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine image version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.event.inputs.next_public_api_url || vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
