# Builds and pushes the backend/frontend prod images to GHCR.
#
# Normal path: after the Release workflow cuts a version, run this manually
# from the Actions tab and leave "tag" blank - it finds the newest vX.Y.Z
# release tag and builds that tag's code (not the branch head, which may
# already have unreleased commits on it). Pass a tag (e.g. v1.7.0) to rebuild
# an older release instead. Also runs automatically when a semver tag is
# pushed by something allowed to trigger workflows (see release.yml's
# RELEASE_TOKEN note).
#
# `latest` only moves when the newest release is being built, so rebuilding
# an old version never rolls `latest` back.
#
# NEXT_PUBLIC_API_URL is left empty by default - docker-compose.prod.yml's
# bundled nginx already proxies both the frontend and `/api/` under one
# external domain (see nginx/templates/locations.inc.template), so the built
# image needs no domain baked in and works behind *any* team's own domain
# unmodified. Only set the workflow_dispatch input if you're publishing a
# build meant to reach the API at a different origin than the one serving
# the frontend (i.e. not using the bundled nginx) - it's not sensitive (it
# ends up in the public frontend JS bundle either way), so a repo Variable
# would be fine too, but isn't needed for the common case.

name: Publish Docker Images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.7.0 - leave blank for the latest release"
        required: false
        default: ""
      next_public_api_url:
        description: "Bake in an absolute NEXT_PUBLIC_API_URL for this build (leave blank for the normal same-origin/bundled-nginx setup)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Full history + tags, so the newest release tag can be found and checked out.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image namespace
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag and check it out
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          latest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z release tags found - run the Release workflow first."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$latest"
          fi

          if ! git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "::error::Tag '${tag}' doesn't exist. Leave the input blank to build the latest release (${latest})."
            exit 1
          fi
          git checkout --quiet --detach "refs/tags/${tag}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "$latest" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Publishing ${tag} (latest release: ${latest})" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image gets its own GHA cache `scope`: with the default (shared)
      # scope, every build's cache export overwrote the previous one's, so
      # the frontend build imported the backend's cache and hit ~nothing.
      # backend-prod is the same scope ci.yml's prod build writes, so a
      # release reuses the layers CI just built for that commit; the
      # frontend also reads ci.yml's frontend-ci scope for its shared deps
      # (npm ci) layer - its build layer differs (NEXT_PUBLIC_API_URL).
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-backend:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.is_latest == 'true' && format('ghcr.io/{0}-backend:latest', steps.repo.outputs.name) || '' }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ github.event.inputs.next_public_api_url }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-frontend:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.is_latest == 'true' && format('ghcr.io/{0}-frontend:latest', steps.repo.outputs.name) || '' }}
          cache-from: |
            type=gha,scope=frontend-prod
            type=gha,scope=frontend-ci
          cache-to: type=gha,scope=frontend-prod,mode=max
