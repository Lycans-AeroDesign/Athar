# Semantic-release: conventional-commit-driven version bump, changelog, GitHub release.
# Manually triggered for now - run from the Actions tab when you're ready to cut a release.
#
# To make this automatic later, switch the trigger to:
#   on:
#     push:
#       branches: [main]

name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN can't trigger other
          # workflows (GitHub blocks this to prevent trigger loops) - use a
          # real PAT so pushing the vX.Y.Z tag here fires
          # docker-publish.yml's `on: push: tags:` automatically. Falls back
          # to GITHUB_TOKEN if RELEASE_TOKEN isn't set, so this still works
          # (minus the auto-trigger) before that secret is configured.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            conventional-changelog-conventionalcommits@^8 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
