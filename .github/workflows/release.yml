# Semantic-release: conventional-commit-driven version bump, changelog, GitHub release.
# Manually triggered for now - run from the Actions tab when you're ready to cut a release.
#
# To make this automatic later, switch the trigger to:
#   on:
#     push:
#       branches: [main]

name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Lets the last step start docker-publish.yml with GITHUB_TOKEN.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A tag pushed with the default GITHUB_TOKEN can't trigger other
          # workflows (GitHub blocks this to prevent trigger loops) - use a
          # real PAT so pushing the vX.Y.Z tag here fires
          # docker-publish.yml's `on: push: tags:` automatically. Falls back
          # to GITHUB_TOKEN if RELEASE_TOKEN isn't set, so this still works
          # (minus the auto-trigger) before that secret is configured.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            conventional-changelog-conventionalcommits@^8 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          # The maintainer's token when set, so the GitHub release is credited
          # to them rather than github-actions[bot].
          # The "chore(release)" commit itself stays authored by
          # semantic-release-bot (its default git identity).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: semantic-release

      # The vX.Y.Z tag sits on the "chore(release): ... [skip ci]" commit, and
      # GitHub skips push-triggered workflows for a [skip ci] head commit - so
      # docker-publish.yml's `on: push: tags:` never fires for a release. Start
      # it explicitly instead. Does nothing when no new version was released.
      # Always uses GITHUB_TOKEN here, not RELEASE_TOKEN: a workflow_dispatch
      # sent with GITHUB_TOKEN still starts the target workflow (the one
      # exception to GitHub's no-trigger rule), and this job's `actions: write`
      # grants it - whereas RELEASE_TOKEN is a PAT without Actions write
      # access and gets a 403 from the dispatches endpoint.
      - name: Publish Docker images for the new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git tag --points-at HEAD --list 'v*.*.*' | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No new release - nothing to publish."
            exit 0
          fi
          echo "Starting Publish Docker Images for $tag"
          gh workflow run docker-publish.yml --ref main -f tag="$tag"
