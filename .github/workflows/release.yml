# Semantic-release: conventional-commit-driven version bump, changelog, GitHub release.
# Manually triggered for now - run from the Actions tab when you're ready to cut a release.
#
# To make this automatic later, switch the trigger to:
#   on:
#     push:
#       branches: [main]

name: Release

on:
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            conventional-changelog-conventionalcommits@^8 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release
