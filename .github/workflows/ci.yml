name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      # No SQLite fallback (backend/config/settings.py) - DATABASE_URL is
      # required, so CI needs a real Postgres service to point it at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest's default apt repos only ship postgresql-client-16, but
      # the `postgres` service above runs 18 (matching docker-compose's own
      # db image) - pg_dump refuses to dump from a newer major server version
      # ("aborting because of server version mismatch"), which broke
      # core.tests.FullInstanceBackupRestoreTests. Installs matching client
      # tools from the official PGDG apt repo instead of pinning the service
      # down to 16.
      - name: Install PostgreSQL 18 client tools (matching the postgres:18 service)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run manage.py check

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run manage.py test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (dev target)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image (prod target)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (prod target)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
