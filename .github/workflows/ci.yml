name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege for the default GITHUB_TOKEN - every job here only checks
# out source, runs tests, and builds images (nobody comments on PRs or
# pushes), so read-only covers everything. Without this block the token gets
# write-all, which is the security-lint complaint (actions/missing-
# workflow-permissions).
permissions:
  contents: read

jobs:
  # Which parts of the repo this push/PR touches, so a docs-only or
  # frontend-only change doesn't spend ~5 minutes on the backend suite (and
  # vice versa). Jobs are skipped with `if:` rather than a workflow-level
  # `paths:` filter: a skipped job reports success, so this keeps working if
  # these checks are ever made required for merging (a workflow that never
  # starts would leave a required check pending forever).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a PR's files through the API
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Editing this workflow re-runs everything, so CI changes are tested.
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/ci.yml"
            frontend:
              - "frontend/**"
              - ".github/workflows/ci.yml"

  backend:
    name: Backend (Django)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      # No SQLite fallback (backend/config/settings.py) - DATABASE_URL is
      # required, so CI needs a real Postgres service to point it at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest's apt only ships postgresql-client-16, but the `postgres` service runs 18
      # (matching docker-compose), and pg_dump refuses a newer server ("server version mismatch"),
      # which broke core.tests.FullInstanceBackupRestoreTests. Install matching client tools from
      # the PGDG apt repo instead of pinning the service to 16.
      - name: Install PostgreSQL 18 client tools (matching the postgres:18 service)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Same uv as backend/Dockerfile - `latest` let a new uv release change
          # CI behavior (and the lockfile format it accepts) without any commit.
          version: "0.12.18"
          # `enable-cache` defaults to "auto" (on for ordinary push/pull_request triggers); set
          # explicitly so it doesn't silently turn off if a riskier trigger is added. `cache-python`
          # also caches the interpreter, which `enable-cache` doesn't, so `uv python install` below
          # doesn't re-download Python each run.
          enable-cache: true
          cache-python: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Ruff's default rules (pyflakes + basic pycodestyle) plus import order -
      # catches undefined names and dead imports, e.g. a missing ValidationError
      # import that only failed at request time. Config in pyproject.toml;
      # version pinned for the same reason as uv's.
      - name: Lint (ruff)
        run: uvx ruff@0.14.0 check .

      - name: Formatting (ruff format)
        run: uvx ruff@0.14.0 format --check .

      # Pyrefly + django-stubs/drf-stubs, versions pinned via uv.lock (dev group).
      # Pre-existing errors live in pyrefly-baseline.json, so this fails only on new ones.
      - name: Type check (pyrefly)
        run: uv run pyrefly check

      - name: Django system check
        run: uv run manage.py check

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      # One test database clone per CPU core - roughly 2.7x faster than serial
      # on a 20-core dev machine (355s -> 132s); runners have fewer cores, so
      # expect a smaller but still real gain here.
      - name: Run tests
        run: uv run manage.py test --parallel auto

  frontend:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node's `cache: npm` covers only npm's package cache, not Next.js's build cache
      # (.next/cache); without this `npm run build` is fully cold every run. Keyed on the lockfile
      # plus all source files (per Next.js's CI-caching guidance), falling back to a lockfile-only
      # match when only source changed.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Prettier, including import order (@ianvs/prettier-plugin-sort-imports) - see .prettierrc.json.
      - name: Formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # Run when either side changed and nothing failed. Without this, one of
    # backend/frontend being skipped would skip this job too.
    if: >-
      !cancelled() && !failure()
      && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image (dev target)
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: dev
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      - name: Build backend image (prod target)
        if: needs.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - name: Build frontend image (prod target)
        if: needs.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,scope=frontend-ci,mode=max
