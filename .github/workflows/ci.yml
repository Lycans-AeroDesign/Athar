name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      # No SQLite fallback (backend/config/settings.py) - DATABASE_URL is
      # required, so CI needs a real Postgres service to point it at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest's default apt repos only ship postgresql-client-16, but
      # the `postgres` service above runs 18 (matching docker-compose's own
      # db image) - pg_dump refuses to dump from a newer major server version
      # ("aborting because of server version mismatch"), which broke
      # core.tests.FullInstanceBackupRestoreTests. Installs matching client
      # tools from the official PGDG apt repo instead of pinning the service
      # down to 16.
      - name: Install PostgreSQL 18 client tools (matching the postgres:18 service)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          # `enable-cache` already defaults to "auto" (on for GitHub-hosted
          # runners on ordinary push/pull_request triggers, which is all this
          # workflow uses) - set explicitly so it's not implicit, and doesn't
          # silently turn off if a riskier trigger (pull_request_target,
          # release, ...) is ever added to this workflow. `cache-python`
          # additionally caches the downloaded interpreter itself, which
          # `enable-cache` alone does not cover - `uv python install` below
          # would otherwise re-download Python every run regardless.
          enable-cache: true
          cache-python: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run manage.py check

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run manage.py test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node's `cache: npm` above only caches npm's own package cache
      # (~/.npm), not Next.js's own build cache (.next/cache) - without this,
      # `npm run build` below is a fully cold build on every single run,
      # which is the actual slow part, not `npm ci`. Per Next.js's own
      # documented CI-caching guidance (docs/.../ci-build-caching.mdx):
      # key on the lockfile + every source file so a dependency bump or any
      # source change invalidates it, falling back to a lockfile-only match
      # (source changed, deps didn't) rather than a fully cold cache.
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image (dev target)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend image (prod target)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (prod target)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
