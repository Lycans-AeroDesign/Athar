name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-test-secret-key
      # No SQLite fallback (backend/config/settings.py) - DATABASE_URL is
      # required, so CI needs a real Postgres service to point it at.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest's apt only ships postgresql-client-16, but the `postgres` service runs 18
      # (matching docker-compose), and pg_dump refuses a newer server ("server version mismatch"),
      # which broke core.tests.FullInstanceBackupRestoreTests. Install matching client tools from
      # the PGDG apt repo instead of pinning the service to 16.
      - name: Install PostgreSQL 18 client tools (matching the postgres:18 service)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          # `enable-cache` defaults to "auto" (on for ordinary push/pull_request triggers); set
          # explicitly so it doesn't silently turn off if a riskier trigger is added. `cache-python`
          # also caches the interpreter, which `enable-cache` doesn't, so `uv python install` below
          # doesn't re-download Python each run.
          enable-cache: true
          cache-python: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Django system check
        run: uv run manage.py check

      - name: Check for missing migrations
        run: uv run manage.py makemigrations --check --dry-run

      # One test database clone per CPU core - roughly 2.7x faster than serial
      # on a 20-core dev machine (355s -> 132s); runners have fewer cores, so
      # expect a smaller but still real gain here.
      - name: Run tests
        run: uv run manage.py test --parallel auto

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # setup-node's `cache: npm` covers only npm's package cache, not Next.js's build cache
      # (.next/cache); without this `npm run build` is fully cold every run. Keyed on the lockfile
      # plus all source files (per Next.js's CI-caching guidance), falling back to a lockfile-only
      # match when only source changed.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.jsx', 'frontend/**/*.ts', 'frontend/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image (dev target)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: dev
          push: false
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,scope=backend-dev,mode=max

      - name: Build backend image (prod target)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,scope=backend-prod,mode=max

      - name: Build frontend image (prod target)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,scope=frontend-ci,mode=max
