name: Bug Report
description: Report a reproducible bug in the Lycans KMS system.
title: "[Bug]: "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide as much detail as possible.

        If this is a security vulnerability, do not open a public issue.
        Please report it privately via the repository Security tab or:
        https://github.com/security/advisories/new

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the bug.
      placeholder: What is going wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List exact steps so we can reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: The API should return ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: The API returns ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How critical is this issue?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: input
    id: backend_python
    attributes:
      label: Backend Python Version
      placeholder: Python 3.14
    validations:
      required: true

  - type: input
    id: backend_os
    attributes:
      label: Backend OS / Server
      placeholder: Ubuntu 22.04 or Windows Server 2022
    validations:
      required: true

  - type: input
    id: backend_db
    attributes:
      label: Database
      placeholder: PostgreSQL 17 or SQLite
    validations:
      required: true

  - type: input
    id: frontend_nextjs
    attributes:
      label: Frontend Next.js Version (optional)
      placeholder: Next.js 16, React 19
    validations:
      required: false

  - type: input
    id: frontend_browser
    attributes:
      label: Browser and Version (optional)
      placeholder: Chrome 120, Firefox 117
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information / Logs / Screenshots
      description: Include logs, stack traces, screenshots, or related context.
      placeholder: Paste logs or attach screenshots here.
    validations:
      required: false
