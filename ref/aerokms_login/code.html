<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md">
<div class="w-full max-w-md">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-[0_1px_3px_0_rgba(0,0,0,0.05)]">
<!-- Header -->
<div class="flex flex-col items-center mb-xl">
<img alt="AeroKMS Brand Logo" class="h-16 w-16 mb-md object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8cvHP-Lj_QayMjky-KtmGWkDB2rrt_WYSNU8MiRJgE13xAIsSPnWDDD_CYWP2uEERYKjRQWANW_NNd6enKl9QcIg4qSBuyRc51KdX7kHhagRtFdNF42BkXnPH885dEgKm5jy9l9pGuiztqO927_RZPOPwsL-FiuSqIacTVfMkx_vy_Nym6qwODbPhPkgOOxpdlx7TYQa8wCpB6e7ItH1LVpUkZafmC3vX6J65kr-pGYmfBA35jcyZ"/>
<h1 class="font-headline-lg text-headline-lg text-on-surface">AeroKMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Engineering Knowledge System</p>
</div>
<!-- Form -->
<form action="#" class="space-y-lg" method="POST">
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">mail</span>
</div>
<input autocomplete="email" class="block w-full pl-lg py-sm font-mono-sm text-mono-sm text-on-surface bg-surface-container border border-outline-variant rounded-lg focus:ring-primary focus:border-primary placeholder:text-outline focus:outline-none transition-colors" id="email" name="email" placeholder="user@aerokms.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<input autocomplete="current-password" class="block w-full pl-lg py-sm font-mono-sm text-mono-sm text-on-surface bg-surface-container border border-outline-variant rounded-lg focus:ring-primary focus:border-primary placeholder:text-outline focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-md text-body-md text-primary hover:text-primary-fixed-variant transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<div>
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-lg bg-primary-container font-label-caps text-label-caps text-on-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-150 uppercase shadow-[0_1px_3px_0_rgba(0,0,0,0.05)]" type="submit">
                        Login
                    </button>
</div>
</form>
<div class="mt-lg">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-sm bg-surface-container-lowest rounded-full font-label-caps text-label-caps text-on-surface-variant uppercase">Or continue with</span>
</div>
</div>
<div class="mt-lg grid grid-cols-2 gap-md">
<button class="flex items-center justify-center w-full px-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[18px] mr-sm">domain</span>
                        Enterprise SSO
                    </button>
<button class="flex items-center justify-center w-full px-md py-sm border border-outline-variant rounded-lg bg-surface-container-lowest font-body-md text-body-md text-on-surface hover:bg-surface-container-low transition-colors duration-150" type="button">
<span class="material-symbols-outlined text-[18px] mr-sm">cloud</span>
                        Cloud Auth
                    </button>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-xl text-center">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">
                Developed by Lycans AeroDesign Team
            </p>
</div>
</div>
