# Prod-shaped stack: gunicorn backend + standalone Next.js server, no bind mounts.
# Pulls prebuilt backend/frontend images from GHCR (published by
# .github/workflows/docker-publish.yml on each `vX.Y.Z` tag push) rather than
# building locally - see DEPLOYMENT.md. Set IMAGE_TAG in .env to pin a
# specific version; defaults to `latest`.
# Copy .env.example to .env at the repo root first, then:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lycans_kms}
      POSTGRES_USER: ${POSTGRES_USER:-lycans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lycans}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lycans} -d ${POSTGRES_DB:-lycans_kms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/lycans-aerodesign/athar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: &backend_env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      DATABASE_URL: postgres://${POSTGRES_USER:-lycans}:${POSTGRES_PASSWORD:-lycans}@db:5432/${POSTGRES_DB:-lycans_kms}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-True}
      JWT_REFRESH_COOKIE_SAMESITE: ${JWT_REFRESH_COOKIE_SAMESITE:-Lax}
      JWT_REFRESH_COOKIE_DOMAIN: ${JWT_REFRESH_COOKIE_DOMAIN:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-True}
      # File storage - empty means local disk, using the backend_media volume
      # below (see backend/.env.example); set AWS_STORAGE_BUCKET_NAME (root
      # .env) to switch to S3-compatible object storage instead, at which
      # point that volume is no longer written to (safe to remove later).
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - backend_media:/app/media
      - backend_backups:/app/backup_archives
    # No `ports:` - only nginx is reachable from outside the compose
    # network; the backend is reached by other containers via its service
    # name (see nginx/nginx.conf's `upstream backend`).
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background job runner for backups.tasks.generate_org_backup (see Settings
  # > Backups) - same image/env as backend, just a different container
  # command.
  celery-worker:
    image: ghcr.io/lycans-aerodesign/athar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment: *backend_env
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    # NEXT_PUBLIC_* vars are inlined at build time, not read at runtime - the
    # published image already has NEXT_PUBLIC_API_URL baked in from the
    # "NEXT_PUBLIC_API_URL" GitHub repo variable used by docker-publish.yml.
    # Setting it here in .env would have no effect; it must match at
    # publish time instead.
    image: ghcr.io/lycans-aerodesign/athar-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports:` - only nginx is reachable from outside the compose
    # network; see the matching comment on the backend service above.
    expose:
      - "3000"
    depends_on:
      - backend

  # Terminates real HTTPS via Let's Encrypt (see nginx/templates/prod.conf.template
  # and the certbot service below) - this is the only service with a
  # host-published port in this file; backend/frontend are reachable only
  # through here. First deploy needs a one-time manual step before this can
  # actually start with a real cert - see DEPLOYMENT.md /
  # scripts/init_letsencrypt.sh.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (your real public domain)}
    volumes:
      # Mounted as default.conf.template so its rendered output overwrites
      # the image's own stock conf.d/default.conf - see the matching comment
      # in docker-compose.yml.
      - ./nginx/templates/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/templates/locations.inc.template:/etc/nginx/templates/locations.inc.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - backend
      - frontend

  # Renews the Let's Encrypt certificate nginx uses (see above) - checks
  # twice a day, which is certbot's own recommended cadence; renew() itself
  # only actually re-issues when a cert is within 30 days of expiring, so
  # this is cheap to run this often. Does NOT issue the first certificate -
  # that's the one-time scripts/init_letsencrypt.sh step (see DEPLOYMENT.md),
  # since the very first issuance needs to happen before nginx can even
  # start (it refuses to start with ssl_certificate pointing at a file that
  # doesn't exist yet).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"

volumes:
  postgres_data:
  redis_data:
  backend_media:
  # Output of `manage.py create_full_backup` (see README's Backups section),
  # mounted at /app/backup_archives - a separate volume from backend_media so
  # the operator can retrieve backup archives (docker compose cp/volume
  # inspect) independent of the live media directory.
  backend_backups:
  # Let's Encrypt account/certificate state (certbot_conf) and the ACME
  # HTTP-01 challenge webroot (certbot_www) - shared between nginx (reads
  # the cert, serves the challenge) and certbot (writes the cert, renews
  # it). See scripts/init_letsencrypt.sh.
  certbot_conf:
  certbot_www:
