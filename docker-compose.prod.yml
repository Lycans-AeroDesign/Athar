# Prod-shaped stack: gunicorn backend + standalone Next.js server, no bind mounts.
# Pulls prebuilt backend/frontend images from GHCR (published by
# .github/workflows/docker-publish.yml on each `vX.Y.Z` tag push) rather than
# building locally - see DEPLOYMENT.md. Set IMAGE_TAG in .env to pin a
# specific version; defaults to `latest`.
# Copy .env.example to .env at the repo root first, then:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# Docker's default json-file log driver never rotates, so a busy container's
# log grows until the disk is full. Every service below uses this instead:
# at most 5 x 10 MB per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lycans_kms}
      POSTGRES_USER: ${POSTGRES_USER:-lycans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lycans}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lycans} -d ${POSTGRES_DB:-lycans_kms}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/lycans-aerodesign/athar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment: &backend_env
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      DATABASE_URL: postgres://${POSTGRES_USER:-lycans}:${POSTGRES_PASSWORD:-lycans}@db:5432/${POSTGRES_DB:-lycans_kms}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      JWT_ACCESS_TOKEN_LIFETIME_MINUTES: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-15}
      JWT_REFRESH_TOKEN_LIFETIME_DAYS: ${JWT_REFRESH_TOKEN_LIFETIME_DAYS:-7}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-refresh_token}
      JWT_REFRESH_COOKIE_SECURE: ${JWT_REFRESH_COOKIE_SECURE:-True}
      JWT_REFRESH_COOKIE_SAMESITE: ${JWT_REFRESH_COOKIE_SAMESITE:-Lax}
      JWT_REFRESH_COOKIE_DOMAIN: ${JWT_REFRESH_COOKIE_DOMAIN:-}
      ENABLE_REGISTRATION: ${ENABLE_REGISTRATION:-True}
      ENABLE_ORGANIZATION_REGISTRATION: ${ENABLE_ORGANIZATION_REGISTRATION:-True}
      SUBSCRIPTIONS_ENABLED: ${SUBSCRIPTIONS_ENABLED:-False}
      SUBSCRIPTION_TRIAL_DAYS: ${SUBSCRIPTION_TRIAL_DAYS:-14}
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-14}
      # File storage - empty means local disk, using the backend_media volume
      # below (see backend/.env.example); set AWS_STORAGE_BUCKET_NAME (root
      # .env) to switch to S3-compatible object storage instead, at which
      # point that volume is no longer written to (safe to remove later).
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-virtual}
      # Outgoing email (SMTP) - empty EMAIL_HOST means email is off.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Athar <noreply@localhost>}
      # Encrypts backup archives stored on this server - empty derives a key
      # from SECRET_KEY (see backend/core/crypto.py's server_key()).
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      AUDIT_IP_RETENTION_DAYS: ${AUDIT_IP_RETENTION_DAYS:-90}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - backend_media:/app/media
      - backend_backups:/app/backup_archives
    # No `ports:` - only nginx is reachable from outside the compose
    # network; the backend is reached by other containers via its service
    # name (see nginx/nginx.conf's `upstream backend`).
    expose:
      - "8000"
    # Passes once migrations are done and the server answers /api/v1/health/
    # (which also checks the database) - see backend/docker/healthcheck.py.
    # The Celery containers wait on this instead of migrating themselves.
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background job runner for backups.tasks.generate_org_backup (see Settings
  # > Backups) - same image/env as backend, just a different container
  # command. RUN_MIGRATIONS=false: only the backend migrates/seeds; this
  # waits for it to be healthy instead.
  celery-worker:
    image: ghcr.io/lycans-aerodesign/athar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      <<: *backend_env
      RUN_MIGRATIONS: "false"
    # Asks this worker to answer a ping over the broker - fails when the
    # worker is hung or has lost its Redis connection.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - backend_media:/app/media
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Fires CELERY_BEAT_SCHEDULE (config/settings.py) - currently just
  # files.tasks.delete_unconfirmed_files, hourly. Same image/env as
  # celery-worker, which is the process that actually executes what this
  # schedules; a separate container (not `celery -A config worker -B`) so a
  # worker restart never drops/duplicates the schedule's own timer state.
  celery-beat:
    image: ghcr.io/lycans-aerodesign/athar-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # --schedule: celery beat's default schedule file ("celerybeat-schedule")
    # is a relative path resolving to the CWD (/app), which is root-owned in
    # this image (see backend/Dockerfile/docker/entrypoint.sh - only
    # staticfiles/media get chown'd to appuser) - appuser can't write there,
    # so beat crashed on every startup without this. /tmp is writable by any
    # user and this file only tracks last-run times, so losing it on
    # container recreation is harmless.
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend_env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    # NEXT_PUBLIC_* vars are inlined at build time, not read at runtime - but
    # the published image ships with NEXT_PUBLIC_API_URL empty (see
    # docker-publish.yml), so this needs no setting here at all: nginx below
    # already proxies both this service and the backend under one external
    # domain, so the frontend's own relative /api/... calls just resolve to
    # it. Setting NEXT_PUBLIC_API_URL in .env would have no effect either way
    # - it's a build-time value, not a runtime one.
    image: ghcr.io/lycans-aerodesign/athar-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # No `ports:` - only nginx is reachable from outside the compose
    # network; see the matching comment on the backend service above.
    expose:
      - "3000"
    # The standalone server listens on $HOSTNAME (the container's own name),
    # not 127.0.0.1, so the check calls it by that name.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://' + (process.env.HOSTNAME || '127.0.0.1') + ':3000/en/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

  # Terminates real HTTPS via Let's Encrypt (see nginx/templates/prod.conf.template
  # and the certbot service below) - this is the only service with a
  # host-published port in this file; backend/frontend are reachable only
  # through here. First deploy needs a one-time manual step before this can
  # actually start with a real cert - see DEPLOYMENT.md /
  # scripts/init_letsencrypt.sh.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    # nginx only reads its certificate at start/reload, and the certbot
    # container below can't signal this one - so without this, a renewed
    # certificate was never picked up and HTTPS broke when the old one expired
    # (~90 days). A background loop gracefully reloads every 6h (no dropped
    # connections), then hands off to the image's own entrypoint unchanged -
    # it still sees "nginx" as its first argument, so templates still render.
    entrypoint:
      - /bin/sh
      - -c
      - (while :; do sleep 6h; nginx -s reload; done) & exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set (your real public domain)}
    volumes:
      # Mounted as default.conf.template so its rendered output overwrites
      # the image's own stock conf.d/default.conf - see the matching comment
      # in docker-compose.yml.
      - ./nginx/templates/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/templates/locations.inc.template:/etc/nginx/templates/locations.inc.template:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    depends_on:
      - backend
      - frontend

  # Renews the Let's Encrypt certificate nginx uses (see above) - checks
  # twice a day, which is certbot's own recommended cadence; renew() itself
  # only actually re-issues when a cert is within 30 days of expiring, so
  # this is cheap to run this often. Does NOT issue the first certificate -
  # that's the one-time scripts/init_letsencrypt.sh step (see DEPLOYMENT.md),
  # since the very first issuance needs to happen before nginx can even
  # start (it refuses to start with ssl_certificate pointing at a file that
  # doesn't exist yet).
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done"

# Most cloud VM NICs (GCE in particular) cap real frames at 1460, not the
# Ethernet-standard 1500 Docker's bridge networks default to - packets in
# that 1460-1500 gap silently vanish once they leave the host's real NIC
# instead of being fragmented, and recovery then depends on Path MTU
# Discovery's ICMP round trip, which many cloud firewalls block by default -
# so nothing auto-corrects it and every response over ~1460 bytes stalls for
# many seconds before TCP's own loss-based backoff eventually works around
# it. Override DOCKER_NETWORK_MTU in .env if your host NIC reports something
# else (`ip link show <iface>`).
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1460}

volumes:
  postgres_data:
  redis_data:
  backend_media:
  # Output of `manage.py create_full_backup` (see README's Backups section),
  # mounted at /app/backup_archives - a separate volume from backend_media so
  # the operator can retrieve backup archives (docker compose cp/volume
  # inspect) independent of the live media directory.
  backend_backups:
  # Let's Encrypt account/certificate state (certbot_conf) and the ACME
  # HTTP-01 challenge webroot (certbot_www) - shared between nginx (reads
  # the cert, serves the challenge) and certbot (writes the cert, renews
  # it). See scripts/init_letsencrypt.sh.
  certbot_conf:
  certbot_www:
