<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ strings.subject }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6; padding: 24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" dir="{{ direction }}" style="max-width: 560px; background-color: #ffffff; border-radius: 12px; overflow: hidden; text-align: {% if direction == 'rtl' %}right{% else %}left{% endif %};">
          <tr>
            <td style="height: 6px; line-height: 6px; font-size: 0; background-color: {{ primary_color }};">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding: 24px 32px 0 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  {% if logo_cid %}
                  <td style="vertical-align: middle; padding-{% if direction == 'rtl' %}left{% else %}right{% endif %}: 12px;">
                    <img src="cid:{{ logo_cid }}" alt="" height="48" style="display: block; height: 48px; width: auto; max-width: 160px; border: 0;">
                  </td>
                  {% endif %}
                  <td style="vertical-align: middle;">
                    <p style="margin: 0; color: #111827; font-size: 20px; font-weight: 700;">{{ org_name }}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px;">
              <p style="margin: 0 0 16px 0; color: #111827; font-size: 16px; line-height: 1.6;">{{ strings.greeting }}</p>
              <p style="margin: 0 0 24px 0; color: #374151; font-size: 16px; line-height: 1.6;">{{ strings.intro }}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin: 0 0 24px 0;">
                <tr>
                  <td style="background-color: {{ primary_color }}; border-radius: 8px;">
                    <a href="{{ url }}" style="display: inline-block; padding: 12px 24px; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none;">{{ strings.button }}</a>
                  </td>
                </tr>
              </table>
              <p style="margin: 0 0 8px 0; color: #6b7280; font-size: 13px; line-height: 1.6;">{{ strings.fallback }}</p>
              <p dir="ltr" style="margin: 0 0 24px 0; font-size: 13px; line-height: 1.6; word-break: break-all; text-align: left;"><a href="{{ url }}" style="color: {{ primary_color }};">{{ url }}</a></p>
              <p style="margin: 0 0 12px 0; color: #374151; font-size: 14px; line-height: 1.6;">{{ strings.expiry }}</p>
              <p style="margin: 0; color: #6b7280; font-size: 13px; line-height: 1.6;">{{ strings.ignore }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding: 16px 32px; border-top: 1px solid #e5e7eb; text-align: center;">
              <a href="{{ app_url }}" style="color: #9ca3af; font-size: 12px; text-decoration: none;">{{ strings.sent_by }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
