# ====================================================
# NGINX CONFIG (DEV + PROD TEMPLATE)
# - DEV: HTTP only on port 80 (localhost) - see docker-compose.yml
# - PROD: enable the commented HTTPS + redirect blocks at the bottom - see
#   docker-compose.prod.yml
#
# Sits in front of the Django API only - the frontend (Next.js) keeps its
# own port/origin (see FRONTEND_PORT) and is NOT proxied through here yet;
# CORS_ALLOWED_ORIGINS/NEXT_PUBLIC_API_URL are unchanged by adding this.
# The commented "FRONTEND (NEXT.JS)" block below is where that would go if
# this is ever pointed at a single public origin instead.
# ====================================================

# ====================================================
# GLOBAL SETTINGS
# ====================================================

server_tokens off;

# Docker's embedded DNS - lets the upstream below re-resolve `backend` if its
# container IP changes (a restart, or `docker compose up --scale backend=N`),
# rather than caching the IP nginx saw at startup forever.
resolver 127.0.0.11 valid=10s ipv6=off;

# ====================================================
# RATE LIMITING
# ====================================================
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# Unused until the frontend is proxied through here too (see the commented
# location / block below) - defined now so enabling that block later is a
# one-line uncomment, not a second pass through this file.
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=20r/s;
# Health endpoint (public): stricter than general API traffic.
limit_req_zone $binary_remote_addr zone=health_limit:1m rate=30r/m;

# ====================================================
# UPSTREAMS
# ====================================================
upstream backend {
    zone backend 64k;
    least_conn;
    server backend:8000 resolve max_fails=3 fail_timeout=30s;
}

# Uncomment to also proxy the frontend through this same origin - see the
# commented `location /` block below, and the header comment above.
# upstream frontend {
#     server frontend:3000;
# }

# ====================================================
# LOCAL HTTP SERVER (DEV)
# ====================================================
server {
    listen 80;
    server_name localhost;

    # Allow large request body size. Default is 1m.
    client_max_body_size 20m;

    # ------------------------------------------------
    # SECURITY HEADERS (SAFE FOR HTTP)
    # Django's own SecurityMiddleware/XFrameOptionsMiddleware already send
    # X-Content-Type-Options/X-Frame-Options/Referrer-Policy by default (see
    # backend/config/settings.py) - add_header alone would APPEND to those,
    # not replace them, leaving two (for Referrer-Policy, conflicting) values
    # on the same response. proxy_hide_header strips the upstream's copy
    # first so nginx's values below are the only ones that reach the client.
    # ------------------------------------------------
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------
    # CSP (Content Security Policy)
    # NOTE:
    # - only turn this on once the frontend is actually served from this
    #   same origin (see the commented location / block) - it has no effect
    #   on requests the frontend's own dev server (port 3000) answers directly
    # - tighten for production
    # ------------------------------------------------
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' http:;" always;

    # ------------------------------------------------
    # STATIC FILES (DJANGO)
    # Proxied to the backend rather than served directly from a shared
    # filesystem alias - WhiteNoise already serves /static/ as part of the
    # normal Django request/response cycle in both DEBUG (via
    # WHITENOISE_USE_FINDERS, straight from each app's static/ dir - see
    # backend/config/settings.py) and non-DEBUG (from the collected
    # STATIC_ROOT), so there is nothing extra nginx needs mounted to make
    # this work correctly in either environment.
    # ------------------------------------------------
    location /static/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ------------------------------------------------
    # MEDIA - no direct serving
    # Every uploaded file in this app requires an authenticated, permission-
    # checked Django request to download (see backend/files/views.py) - there
    # is no public /media/ path to expose, by design, not an oversight.
    # ------------------------------------------------
    location /media/ {
        return 404;
    }

    # ------------------------------------------------
    # HEALTH (public, rate-limited; also used by external monitors via nginx)
    # ------------------------------------------------
    location = /api/v1/health/ {
        limit_req zone=health_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ------------------------------------------------
    # BACKEND API (DJANGO)
    # ------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;  # http in dev

        proxy_http_version 1.1;
    }

    # ------------------------------------------------
    # Django admin / OpenAPI schema+docs (DEBUG-only on the backend itself -
    # see backend/config/urls.py; proxied here unconditionally, same as /api/)
    # ------------------------------------------------
    location ~ ^/(admin|api/schema|api/docs)/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------
    # FRONTEND (NEXT.JS) - optional, not enabled (see header comment)
    # ------------------------------------------------
    # Uncomment to proxy the frontend through this same origin. Doing so also
    # means: point NEXT_PUBLIC_API_URL at this origin instead of the
    # backend's own port, and CORS_ALLOWED_ORIGINS stops mattering for
    # same-origin requests (browser same-origin, no CORS preflight at all).
    # location / {
    #     limit_req zone=web_limit burst=50 nodelay;
    #     proxy_pass http://frontend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    # }

    # ------------------------------------------------
    # RATE LIMIT RESPONSE (JSON)
    # ------------------------------------------------
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        return 429 '{"detail": "Too many requests"}';
    }

    # ------------------------------------------------
    # NGINX STATUS (LOCAL ONLY)
    # ------------------------------------------------
    location /stub_status {
        stub_status;

        # Allow localhost
        allow 127.0.0.1;
        # Allow the default docker compose bridge network range
        allow 172.16.0.0/12;
        deny all;
    }

    # =================================================
    # ========== PROD: ENABLE HTTPS BELOW ==============
    # =================================================
    # In production, you typically:
    # 1) Change the dev server_name above (or ignore it)
    # 2) ENABLE the HTTPS server block below
    # 3) ENABLE the HTTP->HTTPS redirect block below
    #
    # Tip: Replace "yourdomain.com" with your real domain.
    #

    # ------------------------------------------------
    # PROD HTTPS (ENABLE THIS BLOCK IN PRODUCTION)
    # ------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     client_max_body_size 20m;
    #
    #     ssl_certificate     /etc/letsencrypt/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     # Enable HSTS AFTER HTTPS works reliably
    #     # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # Security headers (safe over HTTPS) - proxy_hide_header first, see
    #     # the matching comment on the dev server block above for why.
    #     proxy_hide_header X-Content-Type-Options;
    #     proxy_hide_header X-Frame-Options;
    #     proxy_hide_header Referrer-Policy;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    #     location /static/ {
    #         limit_req zone=api_limit burst=50 nodelay;
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         access_log off;
    #     }
    #
    #     location /media/ { return 404; }
    #
    #     location = /api/v1/health/ {
    #         limit_req zone=health_limit burst=5 nodelay;
    #         limit_req_status 429;
    #         proxy_pass http://backend;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         access_log off;
    #     }
    #
    #     location /api/ {
    #         limit_req zone=api_limit burst=50 nodelay;
    #         limit_req_status 429;
    #
    #         proxy_pass http://backend;
    #
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Host $host;
    #         proxy_set_header X-Forwarded-Port $server_port;
    #         proxy_set_header X-Forwarded-Proto https;
    #
    #         proxy_http_version 1.1;
    #     }
    #
    #     # If you proxy the frontend in prod, add:
    #     # location / { proxy_pass http://frontend; ... }
    #
    #     error_page 429 = @rate_limited;
    #     location @rate_limited {
    #         default_type application/json;
    #         return 429 '{"detail": "Too many requests"}';
    #     }
    #
    #     # Optional: expose stub_status internally only
    #     # location /stub_status {
    #     #     stub_status;
    #     #     allow 127.0.0.1;
    #     #     allow 172.16.0.0/12;
    #     #     deny all;
    #     # }
    # }

    # ------------------------------------------------
    # PROD HTTP -> HTTPS REDIRECT (ENABLE IN PRODUCTION)
    # ------------------------------------------------
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
